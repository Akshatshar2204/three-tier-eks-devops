frontend:
  replicas: 2
  image:
    repository: 828479100787.dkr.ecr.ap-south-1.amazonaws.com/three-tier-eks-frontend
    tag: v2
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

backend:
  replicas: 2
  image:
    repository: 828479100787.dkr.ecr.ap-south-1.amazonaws.com/three-tier-eks-backend
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 3500
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

mongodb:
  image: mongo:5.0
  secretName: mongo-credentials
  storageClassName: gp3-csi
  storageSize: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
