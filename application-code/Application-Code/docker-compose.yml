services:
  mongo:
    image: mongo:5.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "3500"
      MONGO_CONN_STR: "mongodb://mongo:27017/todoapp"
    ports:
      - "3500:3500"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      REACT_APP_BACKEND_URL: "http://localhost:3500/api/tasks"
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
